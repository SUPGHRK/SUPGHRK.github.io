<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>การถ่ายภาพดิจิทัล sec 5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo"></div>

      <nav>
        <a href="#home">Home</a>
        <a href="#landscape">Landscape</a>
        <a href="#portrait">Portrait</a>
        <a href="#food">Food</a>
        <a href="#stilllife">Still Life</a>
        <a href="#travel">Travel</a>
        <a href="#member">Member</a>
      </nav>
    </header>

    <section id="home" class="section home">
      <h2>Group <br />Profile</h2>
    </section>

    <section id="landscape" class="section">
      <h2>Landscape</h2>
      <div class="gallery">
        <img src="pic/L1.jpg" />
        <img src="pic/L2.jpg" />
      </div>
    </section>

    <section id="portrait" class="section">
      <h2>Portrait</h2>
      <div class="gallery">
        <img src="pic/P1.jpg" />
        <img src="pic/P3.jpg" />
      </div>
    </section>

    <section id="food" class="section">
      <h2>Food</h2>
      <div class="gallery">
        <img src="pic/F1.JPG" />
        <img src="pic/F2.JPG" />
      </div>
    </section>

    <section id="stilllife" class="section">
      <h2>Still Life</h2>
      <div class="gallery">
        <img src="pic/S1.JPG" />
        <img src="pic/S2.JPG" />
      </div>
    </section>

    <section id="travel" class="section">
      <h2>Travel</h2>
      <div class="gallery">
        <img src="pic/T1.JPG" />
        <img src="pic/T2.JPG" />
      </div>
    </section>

    <section id="member" class="section">
      <h2>สมาชิกลุ่ม</h2>
      <div id="memberGrid" class="gallery"></div>
    </section>

    <script src="member.js"></script>
    <script src="script.js"></script>
  </body>
</html>
